<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPT 인제스트 현황 — Proposal Workbench</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="badge" style="background: #4f46e5;">HitL</span>
          <h1 style="font-size: 20px; font-weight: 700;">PPTX 인제스트 현황</h1>
        </div>
        <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">슬라이드 분할, 렌더링, 색인 결과를 확인합니다.</p>
      </div>
    </header>

    <div class="info-bar">
      <div style="display: flex; gap: 8px; align-items: center;">
        <span style="color: var(--text-muted);">덱:</span>
        <strong id="deckName">-</strong>
      </div>
      <div style="display: flex; gap: 12px; align-items: center;">
        <span id="renderStatus" class="preview-note">렌더링 상태 확인 중</span>
        <span id="slideCount" style="color: var(--text-muted); font-size: 12px;">0장</span>
      </div>
    </div>

    <div id="gridContainer" class="grid">
      <!-- 슬라이드 카드 -->
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const pptxStem = params.get('pptx') || '';

    async function loadIngest() {
      if (!pptxStem) {
        document.getElementById('deckName').textContent = 'PPTX 경로가 필요합니다.';
        return;
      }
      try {
        const res = await fetch('/api/ingest/' + encodeURIComponent(pptxStem));
        if (!res.ok) throw new Error('인제스트 매니페스트를 찾을 수 없습니다.');
        const manifest = await res.json();
        renderManifest(manifest);
      } catch (err) {
        document.getElementById('deckName').textContent = '오류: ' + err.message;
      }
    }

    function buildPreview(slide) {
      const preview = document.createElement('div');
      preview.className = 'card-preview';

      const showFallback = () => {
        preview.replaceChildren();
        if (slide.html_ref) {
          const frame = document.createElement('iframe');
          frame.src = slide.html_ref;
          frame.title = slide.title || '구조 미리보기';
          frame.setAttribute('sandbox', 'allow-same-origin');
          preview.appendChild(frame);
          return;
        }
        const missing = document.createElement('div');
        missing.className = 'preview-missing';
        missing.textContent = '미리보기 없음';
        preview.appendChild(missing);
      };

      if (slide.image_ref) {
        const img = document.createElement('img');
        img.src = slide.image_ref;
        img.alt = slide.title || '슬라이드 미리보기';
        img.addEventListener('error', showFallback, { once: true });
        preview.appendChild(img);
      } else {
        showFallback();
      }
      return preview;
    }

    function renderManifest(manifest) {
      document.getElementById('deckName').textContent = manifest.source_pptx || pptxStem;
      document.getElementById('slideCount').textContent = (manifest.total_slides || manifest.slides?.length || 0) + '장 처리됨';
      const render = manifest.render || {};
      document.getElementById('renderStatus').textContent = render.status === 'completed'
        ? 'PNG 렌더링 완료'
        : render.status === 'skipped' ? 'PNG 렌더링 생략' : 'PNG 렌더링 실패 · 구조 미리보기 사용';

      const grid = document.getElementById('gridContainer');
      grid.innerHTML = '';

      (manifest.slides || []).forEach((s) => {
        const card = document.createElement('div');
        card.className = 'card';

        card.appendChild(buildPreview(s));

        const body = document.createElement('div');
        body.className = 'card-body';

        const title = document.createElement('div');
        title.className = 'card-title';
        title.textContent = (s.slide_no ? s.slide_no + '. ' : '') + (s.title || '제목 없음');

        const desc = document.createElement('div');
        desc.className = 'card-desc';
        desc.textContent = s.image_description || '';

        const status = document.createElement('div');
        status.className = 'preview-note';
        status.textContent = s.image_ref ? 'PNG 미리보기' : (s.html_ref ? 'PNG 없음 · 구조 미리보기' : '미리보기 없음');

        body.appendChild(title);
        body.appendChild(desc);
        body.appendChild(status);
        card.appendChild(body);
        grid.appendChild(card);
      });
    }

    loadIngest();
  </script>
</body>
</html>
