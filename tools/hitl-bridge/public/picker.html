<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>레퍼런스 장표 피커 — Proposal Workbench</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="badge">HitL</span>
          <h1 style="font-size: 20px; font-weight: 700;">레퍼런스 장표 선택</h1>
        </div>
        <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Agent가 검색한 후보입니다. 참고할 슬라이드를 선택해 주세요.</p>
      </div>
      <div id="actionArea">
        <button id="btnConfirm" class="btn" style="display: none;">
          <span id="btnConfirmText">선택 확정</span>
        </button>
      </div>
    </header>

    <div id="completedBanner" class="banner" style="display: none;">
      선택이 저장됐습니다. <strong>Agent 채팅창으로 돌아가 "골랐어"</strong>라고 입력하면 다음 작업을 이어갑니다.
    </div>

    <div class="info-bar">
      <div style="display: flex; gap: 8px; align-items: center;">
        <span style="color: var(--text-muted);">검색어:</span>
        <strong id="queryText">-</strong>
        <span id="searchModeBadge" class="badge" style="background: #64748b;">-</span>
      </div>
      <div id="candidateCount" style="color: var(--text-muted); font-size: 12px;">0건 후보</div>
    </div>

    <div id="gridContainer" class="grid">
      <!-- 후보 카드 -->
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sid = params.get('session') || '';
    let sessionData = null;
    let selectedIds = new Set();

    async function loadSession() {
      if (!sid) {
        document.getElementById('queryText').textContent = '세션 ID가 필요합니다.';
        return;
      }
      try {
        const res = await fetch('/api/sessions/' + encodeURIComponent(sid));
        if (!res.ok) throw new Error('세션을 찾을 수 없습니다.');
        sessionData = await res.json();
        renderSession();
      } catch (err) {
        document.getElementById('queryText').textContent = '오류: ' + err.message;
      }
    }

    function renderSession() {
      document.getElementById('queryText').textContent = sessionData.query || '-';
      document.getElementById('searchModeBadge').textContent = (sessionData.search_mode === 'semantic' ? 'Semantic (BGE-M3)' : 'Lexical (키워드)');
      document.getElementById('candidateCount').textContent = (sessionData.candidates?.length || 0) + '건 후보';

      if (sessionData.status === 'completed') {
        document.getElementById('completedBanner').style.display = 'block';
        if (sessionData.selected_slide_ids) {
          selectedIds = new Set(sessionData.selected_slide_ids);
        }
      }

      const grid = document.getElementById('gridContainer');
      grid.innerHTML = '';

      (sessionData.candidates || []).forEach((c) => {
        const card = document.createElement('div');
        card.className = 'card' + (selectedIds.has(c.slide_id) ? ' selected' : '');
        card.onclick = () => toggleSelect(c.slide_id);

        const img = document.createElement('img');
        img.src = c.image_ref || '';
        img.alt = c.title || '슬라이드 미리보기';

        const body = document.createElement('div');
        body.className = 'card-body';

        const title = document.createElement('div');
        title.className = 'card-title';
        title.textContent = (c.slide_no ? c.slide_no + '. ' : '') + (c.title || '제목 없음');

        const desc = document.createElement('div');
        desc.className = 'card-desc';
        desc.textContent = c.image_description || '';

        const tagsDiv = document.createElement('div');
        tagsDiv.className = 'tags';
        (c.tags || []).forEach((t) => {
          const tag = document.createElement('span');
          tag.className = 'tag';
          tag.textContent = t;
          tagsDiv.appendChild(tag);
        });

        body.appendChild(title);
        body.appendChild(desc);
        body.appendChild(tagsDiv);

        card.appendChild(img);
        card.appendChild(body);
        grid.appendChild(card);
      });

      updateActionArea();
    }

    function toggleSelect(id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      renderSession();
    }

    function updateActionArea() {
      const btn = document.getElementById('btnConfirm');
      if (selectedIds.size > 0 && sessionData?.status !== 'completed') {
        btn.style.display = 'inline-flex';
        document.getElementById('btnConfirmText').textContent = selectedIds.size + '개 선택 확정';
      } else {
        btn.style.display = 'none';
      }
    }

    document.getElementById('btnConfirm').onclick = async () => {
      try {
        const res = await fetch('/api/sessions/' + encodeURIComponent(sid) + '/select', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ selected_slide_ids: Array.from(selectedIds) })
        });
        if (res.ok) {
          document.getElementById('completedBanner').style.display = 'block';
          document.getElementById('btnConfirm').style.display = 'none';
        }
      } catch (err) {
        alert('저장 실패: ' + err.message);
      }
    };

    loadSession();
  </script>
</body>
</html>
