<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>???? ?? ?? ? Proposal Workbench</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="badge">HitL</span>
          <h1 style="font-size: 20px; font-weight: 700;">???? ?? ??</h1>
        </div>
        <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Agent? ??? ?? ?? ?????. ??? ????? ??? ???.</p>
      </div>
      <div id="actionArea">
        <button id="btnConfirm" class="btn" style="display: none;">
          <span id="btnConfirmText">?? ??</span>
        </button>
      </div>
    </header>

    <div id="completedBanner" class="banner" style="display: none;">
      ??? ???????! <strong>Agent ????? ??? "???"</strong>?? ????? ?? ??? ?????.
    </div>

    <div class="info-bar">
      <div style="display: flex; gap: 8px; align-items: center;">
        <span style="color: var(--text-muted);">???:</span>
        <strong id="queryText">-</strong>
        <span id="searchModeBadge" class="badge" style="background: #64748b;">-</span>
      </div>
      <div id="candidateCount" style="color: var(--text-muted); font-size: 12px;">0? ???</div>
    </div>

    <div id="gridContainer" class="grid">
      <!-- ?? ?? ??? -->
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sid = params.get('session') || '';
    let sessionData = null;
    let selectedIds = new Set();

    async function loadSession() {
      if (!sid) {
        document.getElementById('queryText').textContent = '?? ID? ???? ?????.';
        return;
      }
      try {
        const res = await fetch('/api/sessions/' + encodeURIComponent(sid));
        if (!res.ok) throw new Error('??? ??? ? ????.');
        sessionData = await res.json();
        renderSession();
      } catch (err) {
        document.getElementById('queryText').textContent = '??: ' + err.message;
      }
    }

    function renderSession() {
      document.getElementById('queryText').textContent = sessionData.query || '-';
      document.getElementById('searchModeBadge').textContent = (sessionData.search_mode === 'semantic' ? 'Semantic (BGE-M3)' : 'Lexical (???)');
      document.getElementById('candidateCount').textContent = (sessionData.candidates?.length || 0) + '? ???';

      if (sessionData.status === 'completed') {
        document.getElementById('completedBanner').style.display = 'block';
        if (sessionData.selected_slide_ids) {
          selectedIds = new Set(sessionData.selected_slide_ids);
        }
      }

      const grid = document.getElementById('gridContainer');
      grid.innerHTML = '';

      (sessionData.candidates || []).forEach((c) => {
        const card = document.createElement('div');
        card.className = 'card' + (selectedIds.has(c.slide_id) ? ' selected' : '');
        card.onclick = () => toggleSelect(c.slide_id);

        const img = document.createElement('img');
        img.src = c.image_ref || '';
        img.alt = c.title || '???? ???';

        const body = document.createElement('div');
        body.className = 'card-body';

        const title = document.createElement('div');
        title.className = 'card-title';
        title.textContent = (c.slide_no ? c.slide_no + '. ' : '') + (c.title || '?? ??');

        const desc = document.createElement('div');
        desc.className = 'card-desc';
        desc.textContent = c.image_description || '';

        const tagsDiv = document.createElement('div');
        tagsDiv.className = 'tags';
        (c.tags || []).forEach((t) => {
          const tag = document.createElement('span');
          tag.className = 'tag';
          tag.textContent = t;
          tagsDiv.appendChild(tag);
        });

        body.appendChild(title);
        body.appendChild(desc);
        body.appendChild(tagsDiv);

        card.appendChild(img);
        card.appendChild(body);
        grid.appendChild(card);
      });

      updateActionArea();
    }

    function toggleSelect(id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      renderSession();
    }

    function updateActionArea() {
      const btn = document.getElementById('btnConfirm');
      if (selectedIds.size > 0 && sessionData?.status !== 'completed') {
        btn.style.display = 'inline-flex';
        document.getElementById('btnConfirmText').textContent = selectedIds.size + '? ?? ??';
      } else {
        btn.style.display = 'none';
      }
    }

    document.getElementById('btnConfirm').onclick = async () => {
      try {
        const res = await fetch('/api/sessions/' + encodeURIComponent(sid) + '/select', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ selected_slide_ids: Array.from(selectedIds) })
        });
        if (res.ok) {
          document.getElementById('completedBanner').style.display = 'block';
          document.getElementById('btnConfirm').style.display = 'none';
        }
      } catch (err) {
        alert('?? ??: ' + err.message);
      }
    };

    loadSession();
  </script>
</body>
</html>
