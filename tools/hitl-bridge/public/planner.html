<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>???? ??? ??? ? Proposal Workbench</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="badge" style="background: #059669;">HitL</span>
          <h1 style="font-size: 20px; font-weight: 700;">???? ???(Blueprint) ?? ? ??</h1>
        </div>
        <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">??? ??? ???? 5? ?? ??? ???? ??? ???.</p>
      </div>
      <div id="actionArea">
        <button id="btnApprove" class="btn btn-success">
          <span>?? ??</span>
        </button>
      </div>
    </header>

    <div id="approvedBanner" class="banner" style="display: none;">
      ???? ???????! <strong>Agent ????? ??? "????"</strong>?? ????? ?? PPTX ??? ?????.
    </div>

    <div class="info-bar">
      <div style="display: flex; gap: 8px; align-items: center;">
        <span style="color: var(--text-muted);">???? ID:</span>
        <strong id="reqIdText">-</strong>
      </div>
      <div id="statusBadge" class="badge" style="background: #64748b;">?? ?</div>
    </div>

    <div style="background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 16px;">
      <h3 style="font-size: 14px; font-weight: 700; margin-bottom: 8px;">??? ??? (Governing Message)</h3>
      <textarea id="governingInput" style="width: 100%; min-height: 60px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 14px;"></textarea>
    </div>

    <div id="blocksContainer" style="display: flex; flex-direction: column; gap: 12px;">
      <!-- ?? ??? -->
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sid = params.get('session') || '';
    let sessionData = null;

    async function loadSession() {
      if (!sid) {
        document.getElementById('reqIdText').textContent = '?? ID? ???? ?????.';
        return;
      }
      try {
        const res = await fetch('/api/sessions/' + encodeURIComponent(sid));
        if (!res.ok) throw new Error('??? ??? ? ????.');
        sessionData = await res.json();
        renderSession();
      } catch (err) {
        document.getElementById('reqIdText').textContent = '??: ' + err.message;
      }
    }

    function renderSession() {
      const bp = sessionData.blueprint || {};
      document.getElementById('reqIdText').textContent = bp.requirement_id || sessionData.requirement_id || '-';
      document.getElementById('governingInput').value = bp.governing_message || '';

      if (sessionData.status === 'approved') {
        document.getElementById('approvedBanner').style.display = 'block';
        document.getElementById('statusBadge').textContent = '?? ??';
        document.getElementById('statusBadge').style.background = '#059669';
        document.getElementById('btnApprove').style.display = 'none';
      }

      const container = document.getElementById('blocksContainer');
      container.innerHTML = '';

      (bp.blocks || []).forEach((b, idx) => {
        const card = document.createElement('div');
        card.style.cssText = 'background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 6px;';

        const head = document.createElement('div');
        head.style.cssText = 'display: flex; justify-content: space-between; font-weight: 700; font-size: 13px;';
        head.textContent = '?? ' + (idx + 1) + ': ' + (b.headline || b.role || '??');

        const desc = document.createElement('div');
        desc.style.cssText = 'font-size: 12px; color: var(--text-muted);';
        desc.textContent = '??: ' + (b.role || '-') + ' | ?? ??: ' + (b.topology || '-');

        card.appendChild(head);
        card.appendChild(desc);
        container.appendChild(card);
      });
    }

    document.getElementById('btnApprove').onclick = async () => {
      try {
        const updatedBp = sessionData.blueprint || {};
        updatedBp.governing_message = document.getElementById('governingInput').value;

        const res = await fetch('/api/sessions/' + encodeURIComponent(sid) + '/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ blueprint: updatedBp })
        });
        if (res.ok) {
          document.getElementById('approvedBanner').style.display = 'block';
          document.getElementById('btnApprove').style.display = 'none';
        }
      } catch (err) {
        alert('?? ??: ' + err.message);
      }
    };

    loadSession();
  </script>
</body>
</html>
