<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposal Workbench HitL Portal</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container" style="max-width: 800px; margin-top: 40px;">
    <header>
      <div>
        <span class="badge">Proposal Workbench</span>
        <h1 style="font-size: 24px; font-weight: 700; margin-top: 6px;">HitL Viewer Portal</h1>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Agent가 사람의 시각적 판단을 요청할 때 여는 화면입니다.</p>
      </div>
    </header>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px;">
      <a href="/search" style="text-decoration: none; color: inherit;">
        <div class="card" style="padding: 20px;">
          <h2 style="font-size: 16px; font-weight: 700; color: var(--primary);">레퍼런스 장표 피커 (/search)</h2>
          <p style="font-size: 12px; color: var(--text-muted); margin-top: 6px;">과거 장표를 비교하고 선택합니다.</p>
        </div>
      </a>
      <a href="/planning" style="text-decoration: none; color: inherit;">
        <div class="card" style="padding: 20px;">
          <h2 style="font-size: 16px; font-weight: 700; color: #059669;">청사진 검토 (/planning)</h2>
          <p style="font-size: 12px; color: var(--text-muted); margin-top: 6px;">거버닝 메시지와 5개 블록을 검토합니다.</p>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
